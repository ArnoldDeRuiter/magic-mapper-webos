name: webOS app

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --global @nubjs/nub@0.7.5
      - run: nub ci
      - run: nub run check
      - run: nub run package

  # Releases published by Release Please build through release-please.yml instead:
  # events raised by GITHUB_TOKEN do not start another workflow run.
  release:
    if: github.event_name == 'release'
    needs: check
    permissions:
      contents: write
    uses: ./.github/workflows/release-build.yml
    with:
      tag: ${{ github.event.release.tag_name }}
