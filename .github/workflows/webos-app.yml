name: webOS app

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --global @nubjs/nub@0.7.5
      - run: nub ci
      - run: nub run check
      - run: nub run package

  release:
    if: github.event_name == 'release'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --global @nubjs/nub@0.7.5
      - run: nub ci

      - name: Set app version from release tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          python3 - "${TAG#v}" <<'EOF'
          import json, sys

          version = sys.argv[1]
          for path in ("appinfo.json", "package.json"):
              with open(path) as manifest:
                  data = json.load(manifest)
              data["version"] = version
              with open(path, "w") as manifest:
                  json.dump(data, manifest, indent=2)
                  manifest.write("\n")
          EOF

      - run: nub run package
      - run: nub run manifest
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}

      - name: Restore formatting
        run: nub run format

      - name: Attach release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: >-
          gh release upload "$TAG" dist/*.ipk dist/*.manifest.json largeIcon.png --repo
          "$GITHUB_REPOSITORY" --clobber

      - name: Commit version and repository index
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add appinfo.json package.json repo.json
          git diff --staged --quiet && exit 0
          git commit -m "chore: set version to $TAG"
          git pull --rebase origin main
          git push origin main
