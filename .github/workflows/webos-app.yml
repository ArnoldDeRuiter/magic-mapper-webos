name: webOS app

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global @nubjs/nub@0.7.5
      - run: nub ci
      - run: nub run check
      - run: nub run package

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global @nubjs/nub@0.7.5
      - run: nub ci
      - run: nub run package
      - run: nub run manifest
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run:
          gh release create "$GITHUB_REF_NAME" dist/*.ipk dist/*.manifest.json largeIcon.png
          --generate-notes --verify-tag
