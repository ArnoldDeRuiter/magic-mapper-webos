name: Sync fork from upstream

# Keeps this fork's main + tags up to date with afonsojramos/magic-mapper-webos.
# A plain branch sync alone wouldn't be enough on its own: their own
# webos-app.yml only builds+releases on a `v*` tag push, not on every push to
# main, so tags need syncing too -- that's what actually triggers a fresh
# release (and ipk) on *this* fork once it lands here.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/afonsojramos/magic-mapper-webos.git
          git fetch upstream --tags

      - name: Merge upstream/main into main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout main
          git merge upstream/main --no-edit

      - name: Push branch + tags
        run: git push origin main --follow-tags
