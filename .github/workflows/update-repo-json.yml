name: Update repo.json for new release

# Fires whenever a release is published on this fork -- whether that's from
# a manually-created release, or (the expected path) a tag synced in from
# upstream by sync-upstream.yml triggering their own webos-app.yml release
# job, which runs here too since it's inherited by the fork. Keeps
# repo.json's version/ipkUrl/ipkHash pointing at whatever the latest real
# release actually is, automatically -- same pattern used on the other
# ArnoldDeRuiter webos apps tonight, just via CI instead of by hand.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find the .ipk asset and compute its hash
        id: asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -e
          IPK_URL=$(gh release view "$TAG" --repo "${{ github.repository }}" --json assets \
            --jq '.assets[] | select(.name | endswith(".ipk")) | .url')
          IPK_NAME=$(gh release view "$TAG" --repo "${{ github.repository }}" --json assets \
            --jq '.assets[] | select(.name | endswith(".ipk")) | .name')
          curl -sL -H "Authorization: token $GH_TOKEN" -H "Accept: application/octet-stream" \
            "$IPK_URL" -o /tmp/app.ipk
          HASH=$(sha256sum /tmp/app.ipk | cut -d' ' -f1)
          VERSION="${TAG#v}"
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/$TAG/$IPK_NAME"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "ipk_url=$DOWNLOAD_URL" >> "$GITHUB_OUTPUT"
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"

      - name: Update repo.json
        run: |
          python3 - <<EOF
          import json
          with open("repo.json") as f:
              data = json.load(f)
          m = data["packages"][0]["manifest"]
          m["version"] = "${{ steps.asset.outputs.version }}"
          m["ipkUrl"] = "${{ steps.asset.outputs.ipk_url }}"
          m["ipkHash"]["sha256"] = "${{ steps.asset.outputs.hash }}"
          with open("repo.json", "w") as f:
              json.dump(data, f, indent=4)
              f.write("\n")
          EOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add repo.json
          git diff --staged --quiet && exit 0
          git commit -m "Update repo.json for ${{ github.event.release.tag_name }}"
          git push origin main
