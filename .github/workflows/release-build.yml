name: Release build

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag the build is published under
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --global @nubjs/nub@0.7.5
      - run: nub ci

      - name: Set app version from release tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          python3 - "${TAG#v}" <<'EOF'
          import json, sys

          version = sys.argv[1]
          for path in ("appinfo.json", "package.json"):
              with open(path) as manifest:
                  data = json.load(manifest)
              data["version"] = version
              with open(path, "w") as manifest:
                  json.dump(data, manifest, indent=2)
                  manifest.write("\n")
          EOF

      # json.dump always expands arrays, so appinfo.json's inline
      # requiredPermissions list has to be reflowed before format:check runs.
      - name: Restore formatting
        run: nub run format

      - run: nub run check
      - run: nub run package
      - run: nub run manifest
        env:
          RELEASE_TAG: ${{ inputs.tag }}

      - name: Attach release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: >-
          gh release upload "$TAG" dist/*.ipk dist/*.manifest.json largeIcon.png --repo
          "$GITHUB_REPOSITORY" --clobber

      - name: Commit version and repository index
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add appinfo.json package.json repo.json
          git diff --staged --quiet && exit 0
          git commit -m "chore: set version to $TAG"
          git pull --rebase origin main
          git push origin main
