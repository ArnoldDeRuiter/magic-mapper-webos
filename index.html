<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Magic Mapper</title>
    <link rel="stylesheet" href="css/app.css">
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="wordmark" aria-label="Magic Mapper">
          <span class="mark">M</span>
          <span>Magic Mapper</span>
        </div>
        <div class="topbar-actions">
          <div class="status-line">
            <span id="status-dot" class="status-dot"></span>
            <span id="status-label">Checking</span>
          </div>
          <button id="system-button" class="icon-button focusable" type="button" aria-label="Settings">
            <span aria-hidden="true">⚙</span>
          </button>
        </div>
      </header>

      <main id="app" aria-live="polite">
        <section class="screen-heading">
          <div>
            <h1>Remote buttons</h1>
            <p id="summary" class="summary">Reading your mappings…</p>
          </div>
          <button id="discover-button" class="primary focusable" type="button">
            <span class="plus" aria-hidden="true">＋</span>
            <span>Add button</span>
          </button>
        </section>

        <section id="service-banner" class="service-banner" hidden>
          <div>
            <strong id="service-title">Magic Mapper needs setup</strong>
            <p id="service-copy">Set up the local mapper service to change remote buttons.</p>
          </div>
          <button id="primary-button" class="secondary focusable" type="button">Set up</button>
        </section>

        <section class="mappings-section">
          <div id="mappings" class="mappings"></div>
          <div id="empty-state" class="empty-state" hidden>
            <span class="empty-glyph">＋</span>
            <div>
              <strong>No changed buttons</strong>
              <p>Choose Add button, then press a button on the remote.</p>
            </div>
          </div>
        </section>
      </main>

      <footer>
        <span>OK&nbsp; Select</span><span>Back&nbsp; Close</span>
      </footer>
    </div>

    <div id="modal" class="modal" hidden>
      <div class="modal-scrim"></div>
      <section id="modal-card" class="modal-card" role="dialog" aria-modal="true"></section>
    </div>
    <div id="toast" class="toast" role="status" hidden></div>

    <script src="js/platform.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
